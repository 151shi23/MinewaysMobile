<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<title>BBEngine</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<meta name="robots" content="noindex">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #15171B;
		}
		/* 内核需要真实的视口尺寸（WebGL 上下文在 0 尺寸下会创建失败），
		   因此这里铺满整个页面；原生界面会在上层覆盖一块不透明面板。 */
		#bb {
			position: fixed;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
		}
	</style>
</head>
<body>
	<iframe id="bb" src="../blockbench/index.html" title="Blockbench engine"></iframe>
	<script src="engine.js"></script>
</body>
</html>
